<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Fact Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Personalized Fun Fact Generator</h1>
        <label>Enter your Date of Birth :</label>
        <input type="date" id="dob"><br>
        <label>Choose your Favourite Color</label>
        <select id="color">
            <option value="red">Red</option>
            <option value="blue">Blue</option>
            <option value="green">Green</option>
            <option value="yellow">Yellow</option>
        </select><br>
        <button id="generate-btn">Generate Fun Fact</button>
        <div id="funfact-box">Your fun fact will appear here!</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
